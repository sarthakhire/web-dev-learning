<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bold_italic_inderline</title>
</head>

<body>
    <!-- Bold -->
    <P>This is <b>bold</b> tag.</P>

    <!-- Strong (bold)- Important. -->
    <P>This is <strong>bold</strong> tag.</P>

    <!-- Italic -->
    <P>This is <i>italic<i> tag.</P>

    <!-- em(Italic)-Emphasis -->
    <P>This is <em>italic</em> tag.</P>

    <!-- strikehrough -->
    <p>Price: <s>₹500</s> ₹300</p>

    <!-- Underline -->
    <P>This is <u>Underline</u> tag.</P>

    <!-- Subscript -->
    <P> H<sub>2</sub>O </P>

    <!-- Superscript -->
    <p>2<sup>n</sup></p>

    <!-- Deleted Text -->
     <p>Meeting time: <del>2 PM</del> 4 PM</p>

</body>

</html>

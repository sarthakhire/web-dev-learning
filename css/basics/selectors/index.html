<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>CSS Selectors and Properties</title>
</head>
<body>
    <h1>Selectors</h1>

    <h2>Types of selectors:</h2>
    <div class="selectors">    
    <ol id="selector-names">
        <li>Universal Selector</li>
        <li>Element Selector</li>
        <li>Class Selector</li>
        <li>ID Selector</li>
        <li>Grouping Selector</li>
        <li>Descendent Selector</li>
    </ol>
    </div>

    <div class="properties">
        <ul id="propertie-names">
            <li>color</li>
            <li>background-color</li>
            <li>width</li>
            <li>height</li>
            <li>font-size</li>
            <li>font-weight</li>
            <li>text-align</li>
        </ul>
    </div>
    
</body>
</html>
